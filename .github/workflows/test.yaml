name: Create am S3 Bucket

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  creating_bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Debug - show OIDC token claims
        run: |
          echo "role-to-assume: arn:aws:iam::796973498652:role/so-sweet-co-role"
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 - "$JWT" <<'EOF'
          import sys, base64, json
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keep = {k: claims.get(k) for k in
                  ["iss", "aud", "sub", "repository", "repository_owner", "ref", "workflow", "job_workflow_ref"]}
          print(json.dumps(keep, indent=2))
          EOF

      - name: Set up AWS Creds
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::796973498652:role/so-sweet-co-role
          aws-region: us-east-1

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        env: 
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: terraform plan
        working-directory: terraform

      - name: Terraform Apply
        env:
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: terraform apply -auto-approve
        working-directory: terraform
